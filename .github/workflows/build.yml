name: Build standalone patchers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows executable
        run: pyinstaller --clean --noconfirm YuhiKaerimichiKoreanPatch.spec

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\YuhiKaerimichiKoreanPatch.exe package\YuhiKaerimichiKoreanPatch.exe
          Copy-Item README_WINDOWS.txt package\README.txt
          Compress-Archive -Path package\* -DestinationPath YuhiKaerimichiKoreanPatch_Windows_x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: YuhiKaerimichiKoreanPatch_Windows_x64
          path: YuhiKaerimichiKoreanPatch_Windows_x64.zip

  mac-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build macOS Intel executable
        run: pyinstaller --clean --noconfirm YuhiKaerimichiKoreanPatch.spec

      - name: Package macOS Intel
        run: |
          mkdir -p package
          cp dist/YuhiKaerimichiKoreanPatch package/YuhiKaerimichiKoreanPatch
          cp mac_실행.command package/실행.command
          cp README_MAC.txt package/README.txt
          chmod +x package/YuhiKaerimichiKoreanPatch package/실행.command
          ditto -c -k --sequesterRsrc --keepParent package YuhiKaerimichiKoreanPatch_macOS_Intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: YuhiKaerimichiKoreanPatch_macOS_Intel
          path: YuhiKaerimichiKoreanPatch_macOS_Intel.zip

  mac-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build macOS Apple Silicon executable
        run: pyinstaller --clean --noconfirm YuhiKaerimichiKoreanPatch.spec

      - name: Package macOS Apple Silicon
        run: |
          mkdir -p package
          cp dist/YuhiKaerimichiKoreanPatch package/YuhiKaerimichiKoreanPatch
          cp mac_실행.command package/실행.command
          cp README_MAC.txt package/README.txt
          chmod +x package/YuhiKaerimichiKoreanPatch package/실행.command
          ditto -c -k --sequesterRsrc --keepParent package YuhiKaerimichiKoreanPatch_macOS_AppleSilicon.zip

      - uses: actions/upload-artifact@v4
        with:
          name: YuhiKaerimichiKoreanPatch_macOS_AppleSilicon
          path: YuhiKaerimichiKoreanPatch_macOS_AppleSilicon.zip
